name: PHP Syntax Check (CI/CD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  php-lint:
    name: Syntax & Lint Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Check PHP Syntax (php -l)
        run: |
          echo "Starting recursive PHP syntax check..."
          find . -type f -name "*.php" ! -path "./vendor/*" -exec php -l {} +
          echo "All PHP files passed syntax check!"
